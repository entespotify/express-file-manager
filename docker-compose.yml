version: '3.8'
services:
  express-file-manager:
    image: ghcr.io/entespotify/express-file-manager-armv6:main
    environment:
      - BASE_DIR=/app
      - WEB_DIR=/web
      - ISSUER=https://sso-provider.com
      - JWKS_URI=https://sso-provider.com/o/.well-known/jwks.json
      - AUDIENCE=sso-audience
      - PORT=4000
    ports:
      - "4000:4000"
    volumes:
      - /opt/file-manager:/app
      - /var/www/html:/web
    restart: always
    container_name: file-manager-api
